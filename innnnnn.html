
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloudline Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fa;
    color: #263445;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    height: 100vh;
    background: #17243a;
    color: white;
    position: fixed;
    top: 0;
    left: 0;
    padding: 20px;
    overflow-y: auto;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 40px;
}

.logo span {
    color: #39b6e9;
}

.menu a {
    display: block;
    color: #d5e1ec;
    text-decoration: none;
    padding: 14px;
    margin-bottom: 8px;
    border-radius: 8px;
}

.menu a:hover,
.menu a.active {
    background: #1d4569;
    color: white;
}

/* MAIN */
.main {
    margin-left: 250px;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 27px;
}

.header p {
    color: #8995a3;
    margin-top: 6px;
}

.profile {
    background: white;
    padding: 12px 18px;
    border-radius: 10px;
}

/* CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 23px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #00000008;
}

.card h3 {
    color: #8793a0;
    font-size: 14px;
}

.card h2 {
    font-size: 30px;
    margin-top: 15px;
}

.card .icon {
    font-size: 25px;
    margin-bottom: 15px;
}

/* CONTENT */
.content {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

.panel {
    background: white;
    padding: 23px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.panel h2 {
    margin-bottom: 20px;
    font-size: 19px;
}

/* BUTTONS */
.btn {
    background: #087fc0;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    background: #06669c;
}

.action {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    text-align: left;
    padding: 14px 10px;
    border-bottom: 1px solid #edf0f3;
    font-size: 14px;
}

th {
    color: #8995a3;
}

.status {
    background: #fff0cf;
    color: #a36a00;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
}

.delivered {
    background: #d9f7e7;
    color: #16844c;
}

.quick a {
    display: block;
    padding: 15px;
    background: #f4f7fa;
    margin-bottom: 10px;
    border-radius: 8px;
    color: #263445;
    text-decoration: none;
}

/* MOBILE */
@media(max-width: 900px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .content {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 600px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .menu {
        display: flex;
        flex-wrap: wrap;
    }

    .menu a {
        padding: 10px;
    }

    .main {
        margin-left: 0;
        padding: 18px;
    }

    .cards {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .card {
        padding: 15px;
    }

    .card h2 {
        font-size: 23px;
    }

    .header {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
    }

    .panel {
        overflow-x: auto;
    }
}
</style>
</head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory System</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin-left: 250px;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #1e293b;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #ddd;
}

input, button {
    padding: 10px;
    margin: 5px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

input {
    box-sizing: border-box;
}

.form input {
    width: 100%;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.delete {
    background: #dc2626;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #e2e8f0;
}

.summary {
    font-size: 20px;
    font-weight: bold;
    color: #2563eb;
}

</style>
</head>

<body>

<div class="container">

<h1>INVENTORY SYSTEM</h1>

<div class="card">
    <h2>Add New Product</h2>

    <div class="form">
        <input type="text" id="name" placeholder="Product Name">
        <input type="number" id="quantity" placeholder="Quantity" min="0">
        <input type="number" id="price" placeholder="Price" min="0" step="0.01">

        <button onclick="addProduct()">Add Product</button>
    </div>
</div>

<div class="card">
    <h2>Inventory Summary</h2>
    <p>Total Products: <span id="totalProducts">0</span></p>
    <p>Total Stock: <span id="totalStock">0</span></p>
    <p class="summary">Total Value: PHP <span id="totalValue">0.00</span></p>
</div>

<div class="card">
    <h2>Product List</h2>

    <input type="text" id="search"
    placeholder="Search product..." onkeyup="displayProducts()"
    style="width:100%;">

    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="productList"></tbody>
    </table>
</div>

</div>

<script>

let inventory = JSON.parse(localStorage.getItem("inventory")) || [];

function saveData() {
    localStorage.setItem("inventory", JSON.stringify(inventory));
}

function addProduct() {

    let name = document.getElementById("name").value.trim();
    let quantity = Number(document.getElementById("quantity").value);
    let price = Number(document.getElementById("price").value);

    if (name === "" || 
        document.getElementById("quantity").value === "" ||
        document.getElementById("price").value === "" ||
        !Number.isInteger(quantity) || quantity < 0 ||
        !Number.isFinite(price) || price < 0) {
        alert("Please enter valid product details!");
        return;
    }

    inventory.push({
        name: name,
        quantity: quantity,
        price: price
    });

    saveData();
    displayProducts();

    document.getElementById("name").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("price").value = "";

    alert("Product added successfully!");
}

function displayProducts() {

    let list = document.getElementById("productList");
    let search = document.getElementById("search").value.toLowerCase();

    list.innerHTML = "";

    inventory.forEach((product, index) => {

        if (product.name.toLowerCase().includes(search)) {

            let row = document.createElement("tr");

            let nameCell = document.createElement("td");
            nameCell.textContent = product.name;

            let quantityCell = document.createElement("td");
            quantityCell.textContent = product.quantity;

            let priceCell = document.createElement("td");
            priceCell.textContent = "PHP " + product.price.toFixed(2);

            let totalCell = document.createElement("td");
            totalCell.textContent = "PHP " +
                (product.quantity * product.price).toFixed(2);

            let actionCell = document.createElement("td");

            let stockIn = document.createElement("button");
            stockIn.textContent = "Stock In";
            stockIn.onclick = () => updateStock(index, "in");

            let stockOut = document.createElement("button");
            stockOut.textContent = "Stock Out";
            stockOut.onclick = () => updateStock(index, "out");

            let deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";
            deleteButton.onclick = () => deleteProduct(index);

            actionCell.append(stockIn, stockOut, deleteButton);

            row.append(nameCell, quantityCell, priceCell,
                totalCell, actionCell);

            list.appendChild(row);
        }
    });

    updateSummary();
}

function updateStock(index, type) {

    let amount = Number(prompt("Enter quantity: "));

    if (!Number.isInteger(amount) || amount <= 0) {
        alert("Invalid quantity!");
        return;
    }

    if (type === "in") {
        inventory[index].quantity += amount;
    } else {
        if (amount > inventory[index].quantity) {
            alert("Insufficient stock!");
            return;
        }

        inventory[index].quantity -= amount;
    }

    saveData();
    displayProducts();
}

function deleteProduct(index) {

    if (confirm("Are you sure you want to delete this product?")) {
        inventory.splice(index, 1);
        saveData();
        displayProducts();
    }
}

function updateSummary() {

    let totalProducts = inventory.length;

    let totalStock = inventory.reduce(
        (sum, product) => sum + product.quantity, 0
    );

    let totalValue = inventory.reduce(
        (sum, product) => sum + (product.quantity * product.price), 0
    );

    document.getElementById("totalProducts").textContent = totalProducts;
    document.getElementById("totalStock").textContent = totalStock;
    document.getElementById("totalValue").textContent =
        totalValue.toFixed(2);
}

displayProducts();

</script>

</body>
