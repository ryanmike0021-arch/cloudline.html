<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cloudline Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fa;
    color: #263445;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    height: 100vh;
    background: #17243a;
    color: white;
    position: fixed;
    top: 0;
    left: 0;
    padding: 20px;
    overflow-y: auto;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 40px;
}

.logo span {
    color: #39b6e9;
}

.menu a {
    display: block;
    color: #d5e1ec;
    text-decoration: none;
    padding: 14px;
    margin-bottom: 8px;
    border-radius: 8px;
}

.menu a:hover,
.menu a.active {
    background: #1d4569;
    color: white;
}

/* MAIN */
.main {
    margin-left: 250px;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 27px;
}

.header p {
    color: #8995a3;
    margin-top: 6px;
}

.profile {
    background: white;
    padding: 12px 18px;
    border-radius: 10px;
}

/* CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 23px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #00000008;
}

.card h3 {
    color: #8793a0;
    font-size: 14px;
}

.card h2 {
    font-size: 30px;
    margin-top: 15px;
}

.card .icon {
    font-size: 25px;
    margin-bottom: 15px;
}

/* CONTENT */
.content {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

.panel {
    background: white;
    padding: 23px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.panel h2 {
    margin-bottom: 20px;
    font-size: 19px;
}

/* BUTTONS */
.btn {
    background: #087fc0;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    background: #06669c;
}

.action {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    text-align: left;
    padding: 14px 10px;
    border-bottom: 1px solid #edf0f3;
    font-size: 14px;
}

th {
    color: #8995a3;
}

.status {
    background: #fff0cf;
    color: #a36a00;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
}

.delivered {
    background: #d9f7e7;
    color: #16844c;
}

.quick a {
    display: block;
    padding: 15px;
    background: #f4f7fa;
    margin-bottom: 10px;
    border-radius: 8px;
    color: #263445;
    text-decoration: none;
}

/* MOBILE */
@media(max-width: 900px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .content {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 600px) {
    .sidebar {
        position: relative;
        width: 100%;
        height: auto;
    }

    .menu {
        display: flex;
        flex-wrap: wrap;
    }

    .menu a {
        padding: 10px;
    }

    .main {
        margin-left: 0;
        padding: 18px;
    }

    .cards {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .card {
        padding: 15px;
    }

    .card h2 {
        font-size: 23px;
    }

    .header {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
    }

    .panel {
        overflow-x: auto;
    }
}
</style>
</head>

            <h1>CLOUDELINE CONSUMER GOODS TRADING</h1>
            <p></p>

            👤 Administrator
        </div>
    </div>

</div>
