<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cloudline Dashboard</title>
 
<head>
<style>
<body>
body {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
{
    background: #f4f6fa;
    color: #263445;
}

/* SIDEBAR */
.sidebar {
    width: 250px;
    height: 100vh;
    background: #17243a;
    color: white;
    position: fixed;
    top: 0;
    left: 0;
    padding: 20px;
    overflow-y: auto;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 40px;
}

.logo span {
    color: #39b6e9;
}

.menu a {
    display: block;
    color: #d5e1ec;
    text-decoration: none;
    padding: 14px;
    margin-bottom: 8px;
    border-radius: 8px;
}

.menu a:hover,
.menu a.active {
    background: #1d4569;
    color: white;
}

/* MAIN */
.main {
    margin-left: 250px;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 27px;
}

.header p {
    color: #8995a3;
    margin-top: 6px;
}

.profile {
    background: white;
    padding: 12px 18px;
    border-radius: 10px;
}

/* CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 23px;
    border-radius: 12px;
    box-shadow: 0 3px 12px #00000008;
}

.card h3 {
    color: #8793a0;
    font-size: 14px;
}

.card h2 {
    font-size: 30px;
    margin-top: 15px;
}

.card .icon {
    font-size: 25px;
    margin-bottom: 15px;
}

/* CONTENT */
.content {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

.panel {
    background: white;
    padding: 23px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.panel h2 {
    margin-bottom: 20px;
    font-size: 19px;
}

/* BUTTONS */
.btn {
    background: #087fc0;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    background: #06669c;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    margin: 22px auto;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #1e293b;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px #ddd;
}

input, button {
    padding: 10px;
    margin: 5px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

input {
    box-sizing: border-box;
}

.form input {
    width: 100%;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.delete {
    background: #dc2626;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #e2e8f0;
}

.summary {
    font-size: 20px;
    font-weight: bold;
    color: #2563eb;
}
</style>
</head>

    <head>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        h2 { text-align: center; }
        h3 { text-align: center; }
        form { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-left: 50px; }
        select, input, button { margin: 5px 0; padding: 8px; width: 100%; max-width: 400px; }
        button { background: #4530ff; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 8px; }
        button:hover { background: #218838; }
        button.del { background: #dc3545; padding: 4px 8px; font-size: 0.85rem; width: auto; }
        label { display: inline-block; margin-top: 8px; font-weight: 600; }
        
        .week-group { margin-left: 0px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .week-header { background: #e9f5e9; padding: 10px 15px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        th { background: #f2f2f2; font-weight: bold; }
        tr:last-child td { border-bottom: none; }
        .empty { color: #888; text-align: center; padding: 20px; }
    </style>
</head</style>
</head>

<body>

<div class="container">

<h2>Attendance</h2>

<div class="form-box">

<form id="attendanceForm">

<!-- SEARCHABLE NAME INPUT -->
<input list="employeeList"
id="name"
placeholder="Name"
required>



<datalist id="employeeList">
<option value="JB">
<option value="HANNA">
<option value="RYAN">
<option value="SM">
<option value="SM">
</datalist>

<!-- POSITION -->
<select id="position" required>
<option value="CLOUDLINE">CLOUDLINE</option>
<option value="KYZEN">KYZEN</option>
<option value="ELYZ">ELYZ</option>
<option value="EC MOVE">EC MOVE</option>
</select>

<!-- ADDITIONAL INPUT -->
<input type="text"
id="additional"
placeholder="Bakit nag OT">

<button type="submit">Pumasok</button>

</form>
</div>

<h2>Listahan</h2>

<!-- SEARCH RECORDS -->
<div class="search-box">
<input list="searchOptions"
type="text"
id="searchInput"
placeholder="Search / Piliin ang pangalan...">

<datalist id="searchOptions"></datalist>
</div>

<table>
<thead>
<tr>
<th>Pangalan</th>
<th>Pwesto</th>
<th>Petsa</th>
<th>Oty</th>
<th>Sahod</th>
</tr>
</thead>

<tbody id="attendanceList"></tbody>
</table>

</div>

<script>

let records = JSON.parse(
localStorage.getItem("attendanceRecords") || "[]"
);

function saveRecords() {
    localStorage.setItem(
        "attendanceRecords",
        JSON.stringify(records)
    );
}

function displayRecords(search = "") {

    const list = document.getElementById("attendanceList");
    const options = document.getElementById("searchOptions");

    list.innerHTML = "";
    options.innerHTML = "";

    records.forEach((record, index) => {

        const match =
            record.name.toLowerCase().includes(search.toLowerCase()) ||
            record.position.toLowerCase().includes(search.toLowerCase()) ||
            record.additional.toLowerCase().includes(search.toLowerCase());

        if (match) {

            list.innerHTML += `
            <tr>
                <td>${escapeHTML(record.name)}</td>
                <td>${escapeHTML(record.position)}</td>
                <td>${escapeHTML(record.date)}</td>
                <td>${escapeHTML(record.additional)}</td>
                <td>
                    <button class="delete"
                    onclick="deleteRecord(${index})">
                    Delete
                    </button>
                </td>
            </tr>
            `;

            options.innerHTML += `
            <option value="${escapeHTML(record.name)}">
            `;
        }
    });
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

document.getElementById("attendanceForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const position = document.getElementById("position").value;
    const additional = document.getElementById("additional").value.trim();

    if (!name || !position) return;

    const date = new Date().toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
    });

    records.push({
        name,
        position,
        date,
        additional
    });

    saveRecords();
    displayRecords();

    this.reset();
});

document.getElementById("searchInput")
.addEventListener("input", function() {
    displayRecords(this.value);
});

function deleteRecord(index) {
    if (confirm("Delete this attendance record?")) {
        records.splice(index, 1);
        saveRecords();
        displayRecords(document.getElementById("searchInput").value);
    }
}

displayRecords();

</script>

</body>
</html>
